name: Tune 539 Model

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - name: Run tuning
        run: python -m daily539.tune_cli
        env:
          PYTHONPATH: src
      - name: Commit tuning report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/tuning.md
          git diff --cached --quiet || git commit -m "report: update model tuning results"
          git push origin HEAD:${GITHUB_REF_NAME}
