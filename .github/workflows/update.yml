name: Update Daily 539 analysis
on:
  workflow_dispatch:
  schedule:
    # Taiwan draw days (Mon-Sat). Retry every 30 minutes from 21:30 to 23:30 (UTC+8).
    - cron: "30 13 * * 1-6"
    - cron: "0 14 * * 1-6"
    - cron: "30 14 * * 1-6"
    - cron: "0 15 * * 1-6"
    - cron: "30 15 * * 1-6"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - run: python -m daily539.cli
        env:
          PYTHONPATH: src
      - name: Verify today's official draw is available
        shell: bash
        run: |
          today="$(TZ=Asia/Taipei date +%F)"
          if ! grep -q "資料截止：${today}" reports/latest.md; then
            echo "::error::台彩官方資料尚未更新到 ${today}，等待下一次排程重試。"
            exit 1
          fi
      - name: Commit updated data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data reports
          git diff --cached --quiet || git commit -m "data: update Daily 539 analysis"
          git push
